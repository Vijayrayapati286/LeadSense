server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's own default (1m) is well below what a manual template body
    # needs once it has a pasted/uploaded image embedded as a base64 data
    # URI — base64 alone inflates size ~33%, and a template can carry more
    # than one image. Without this, saving such a template 413s at this
    # proxy before the request ever reaches the backend, while any campaign
    # already created in an earlier step of the same submit is left
    # dangling. 25m covers several embedded images with headroom.
    client_max_body_size 25m;

    # The app calls a relative /api/... (see src/services/api.js), so the
    # backend just needs to be reachable at this path from here — this is
    # also what lets an L4 load balancer (no path routing of its own) sit in
    # front of a single origin instead of needing two public hostnames.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router — unmatched paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
