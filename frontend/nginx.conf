server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The app calls a relative /api/... (see src/services/api.js), so the
    # backend just needs to be reachable at this path from here — this is
    # also what lets an L4 load balancer (no path routing of its own) sit in
    # front of a single origin instead of needing two public hostnames.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router — unmatched paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
